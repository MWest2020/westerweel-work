baseURL = "https://westerweel.work/"
title = "westerweel.work"
theme = "PaperMod"

defaultContentLanguage = "nl"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableEmoji = false
enableGitInfo = true
pygmentsUseClasses = true

# Generate RSS for posts so people can subscribe.
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[pagination]
  pagerSize = 20

# --- Languages -------------------------------------------------------------

[languages]
  [languages.nl]
    languageName = "Nederlands"
    weight = 1
    contentDir = "content/nl"
    [languages.nl.params]
      description = "Mark Westerweel — Platform & DevOps. Aantekeningen, blogs, en wat ik doe."
      [languages.nl.params.homeInfoParams]
        Title = "westerweel.work"
        Content = """
Mark Westerweel — Platform & DevOps consultant.

Ik bouw en repareer infrastructuur voor Nederlandse organisaties die soevereiniteit serieus nemen. Kubernetes, Proxmox, ArgoCD, ISO 27001. Open source waar het kan, eigen ijzer waar het moet.

Hier staan aantekeningen, RCA's, en stukken over werk waar ik tijd in heb gestoken. Geen hot takes, geen AI-content marketing, geen LinkedIn cross-posts.
"""
    [[languages.nl.menu.main]]
      identifier = "posts"
      name = "blog"
      url = "/posts/"
      weight = 10
    [[languages.nl.menu.main]]
      identifier = "diensten"
      name = "diensten"
      url = "/diensten/"
      weight = 20
    [[languages.nl.menu.main]]
      identifier = "workshops"
      name = "workshops"
      url = "/workshops/"
      weight = 25
    [[languages.nl.menu.main]]
      identifier = "projecten"
      name = "projecten"
      url = "/projecten/"
      weight = 27
    [[languages.nl.menu.main]]
      identifier = "about"
      name = "over"
      url = "/about/"
      weight = 30

  [languages.en]
    languageName = "English"
    weight = 2
    contentDir = "content/en"
    [languages.en.params]
      description = "Mark Westerweel — Platform & DevOps. Notes, posts, and what I do."
      [languages.en.params.homeInfoParams]
        Title = "westerweel.work"
        Content = """
Mark Westerweel — Platform & DevOps consultant.

I build and fix infrastructure for Dutch organizations that take sovereignty seriously. Kubernetes, Proxmox, ArgoCD, ISO 27001. Open source where possible, own hardware where necessary.

Notes here, RCAs, and pieces on work I've put real time into. No hot takes, no AI content marketing, no LinkedIn cross-posts.
"""
    [[languages.en.menu.main]]
      identifier = "posts"
      name = "blog"
      url = "/posts/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "services"
      name = "services"
      url = "/services/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "workshops"
      name = "workshops"
      url = "/workshops/"
      weight = 25
    [[languages.en.menu.main]]
      identifier = "projects"
      name = "projects"
      url = "/projects/"
      weight = 27
    [[languages.en.menu.main]]
      identifier = "about"
      name = "about"
      url = "/about/"
      weight = 30

# --- PaperMod params -------------------------------------------------------
# Kept deliberately minimal. No cover images, no fancy hero, no analytics.
# Boring and auditable.

[params]
  env = "production"
  Author = "Mark Westerweel"
  defaultTheme = "dark"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowToc = false
  comments = false
  assets = { disableHLJS = false }

  # homeInfoParams lives under [languages.<lang>.params.homeInfoParams] so the
  # intro flips with the language switcher. PaperMod merges per-language
  # params over global ones; a global homeInfoParams here would override
  # the NL fallback for EN. Keep it per-language.

  # Footer override — PaperMod renders this above its own "Powered by" credits.
  [params.footer]
    text = "<a href=\"mailto:mark@westerweel.work\">mark@westerweel.work</a> · <a href=\"https://github.com/MWest2020\" target=\"_blank\" rel=\"noopener\">GitHub</a> · <a href=\"/posts/index.xml\">RSS</a>"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/MWest2020"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:mark@westerweel.work"

  [[params.socialIcons]]
    name = "rss"
    url = "/posts/index.xml"

# --- Markdown rendering ----------------------------------------------------

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    codeFences = true
    guessSyntax = true
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true
